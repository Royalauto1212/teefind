<!-- FIND TAB -->
<div id="findTab">
  <div class="hero">
    <div class="hero-inner">
      <h1>Find a tee time,<br><em>instantly.</em></h1>
      <p class="hero-sub">All your favourite Montreal courses, one search.</p>
      <div class="filter-card">
        <div class="filter-row-main">
          <div class="field">
            <label>Date</label>
            <input type="date" id="filterDate" onchange="doSearch()" />
          </div>
          <div class="field select-wrap">
            <label>Players</label>
            <select id="filterPlayers" onchange="applyFiltersAndRender()">
              <option value="">Players</option>
              <option value="1">1 player</option>
              <option value="2">2 players</option>
              <option value="3">3 players</option>
              <option value="4">4 players</option>
            </select>
          </div>
          <div class="field select-wrap">
            <label>From</label>
            <select id="filterTimeFrom" onchange="applyFiltersAndRender()">
              <option value="">Any</option>
              <option value="06:00">6 AM</option>
              <option value="07:00">7 AM</option>
              <option value="08:00">8 AM</option>
              <option value="09:00">9 AM</option>
              <option value="10:00">10 AM</option>
              <option value="11:00">11 AM</option>
              <option value="12:00">12 PM</option>
              <option value="13:00">1 PM</option>
              <option value="14:00">2 PM</option>
              <option value="15:00">3 PM</option>
              <option value="16:00">4 PM</option>
              <option value="17:00">5 PM</option>
            </select>
          </div>
          <div class="field select-wrap">
            <label>To</label>
            <select id="filterTimeTo" onchange="applyFiltersAndRender()">
              <option value="">Any</option>
              <option value="08:00">8 AM</option>
              <option value="09:00">9 AM</option>
              <option value="10:00">10 AM</option>
              <option value="11:00">11 AM</option>
              <option value="12:00">12 PM</option>
              <option value="13:00">1 PM</option>
              <option value="14:00">2 PM</option>
              <option value="15:00">3 PM</option>
              <option value="16:00">4 PM</option>
              <option value="17:00">5 PM</option>
              <option value="18:00">6 PM</option>
              <option value="19:00">7 PM</option>
              <option value="20:00">8 PM</option>
            </select>
          </div>
          <div class="field select-wrap">
            <label>Holes</label>
            <select id="filterHoles" onchange="applyFiltersAndRender()">
              <option value="">Any</option>
              <option value="9">9 holes</option>
              <option value="18">18 holes</option>
            </select>
          </div>
          <div class="field select-wrap">
            <label>Sort by</label>
            <select id="sortSelect" onchange="applyFiltersAndRender()">
              <option value="time">Earliest</option>
              <option value="price-asc">Price ↑</option>
              <option value="price-desc">Price ↓</option>
              <option value="distance">Distance</option>
              <option value="name">Name</option>
            </select>
          </div>
          <div class="field">
            <label id="labelNear">Near</label>

          </div>

            <label>km</label>
            <select id="distanceKm" onchange="userLocation && applyFiltersAndRender()">

              <option value="30">30 km</option>
              <option value="50">50 km</option>
              <option value="100">100 km</option>

const WMO = { 0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️' };

async function fetchDailyWeather(courseId, lat, lng, date) {
  const key = `d-${courseId}-${date}`;
  if (weatherCache[key]) return weatherCache[key];
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=America%2FToronto&start_date=${date}&end_date=${date}`);
    const d = await r.json();
    const code = d.daily?.weathercode?.[0];
    const descMap = currentLang === 'fr' ? WMO_DESC_FR : WMO_DESC;
    const result = { icon: WMO[code]||'🌤️', desc: descMap[code]||'', tmax: Math.round(d.daily?.temperature_2m_max?.[0]), tmin: Math.round(d.daily?.temperature_2m_min?.[0]) };
    weatherCache[key] = result;
    return result;
  } catch { return null; }
}

async function fetchHourlyWeather(courseId, lat, lng, date, hour) {
  const key = `h-${courseId}-${date}-${hour}`;
  if (hourlyCache[key]) return hourlyCache[key];
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,weathercode&timezone=America%2FToronto&start_date=${date}&end_date=${date}`);
    const d = await r.json();
    const hours = d.hourly?.time || [];
    const idx = hours.findIndex(t => t.includes(`T${String(hour).padStart(2,'0')}:`));
    if (idx < 0) return null;
    const endIdx = Math.min(idx + Math.ceil(ROUND_HOURS), hours.length - 1);
    const temps = d.hourly.temperature_2m.slice(idx, endIdx + 1);
    const codes = d.hourly.weathercode.slice(idx, endIdx + 1);
    const result = { tStart: Math.round(temps[0]), tEnd: Math.round(temps[temps.length-1]), icon: WMO[codes[0]]||'🌤️', iconEnd: WMO[codes[codes.length-1]]||'🌤️' };
    hourlyCache[key] = result;
    return result;
  } catch { return null; }
};


// ── DISTANCE ──
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

window.geocodeAndFilter = async function geocodeAndFilter() {
  const input = document.getElementById('locationInput').value.trim();
  if (!input) return;
  try {
    const isPostal = /^[A-Za-z]\d[A-Za-z]\s?\d[A-Za-z]\d$/.test(input.trim());
    let d = [];

    if (isPostal) {
      // Structured search against the postalcode field specifically. Free-text search on a bare
      // postal code doesn't reliably parse it as a postcode — it can fall back to fuzzy word matching
      // and return an unrelated place that happens to contain "Canada" in its name.
      const fullCode = input.trim().toUpperCase().replace(/\s+/g, ' ');
      const fsa = fullCode.slice(0, 3); // first 3 chars = forward sortation area, e.g. "H8P"

      let r = await fetch(`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(fullCode)}&country=Canada&format=json&limit=1&countrycodes=ca`);
      d = await r.json();

      if (!d.length) {
        // Full 6-character Canadian postal codes are often missing from OSM's postcode data.
        // Falling back to the 3-character FSA still geocodes to the right neighbourhood/borough.
        r = await fetch(`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(fsa)}&country=Canada&format=json&limit=1&countrycodes=ca`);
        d = await r.json();
      }

      if (!d.length) {
        // Some FSAs have no postcode-boundary data in OSM at all (not even at the 3-char level).
        // Retry as a free-text search, but bounded to the Montreal area so a miss can't escape
        // to an unrelated match elsewhere in the country (as happened before this fix).
        r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(fullCode + ', Quebec, Canada')}&format=json&limit=1&countrycodes=ca&viewbox=-74.3,45.85,-73.1,45.3&bounded=1`);
        d = await r.json();
      }
    } else {
      const query = `${input}, Quebec, Canada`;
      // countrycodes=ca hard-restricts results to Canada. viewbox+bounded biases toward greater Montreal.
      let r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=ca&viewbox=-74.3,45.85,-73.1,45.3&bounded=1`);
      d = await r.json();
      if (!d.length) {
        r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=ca`);
        d = await r.json();
      }
    }

    if (d.length > 0) {
      userLocation = { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
      lastGeocodedInput = input;
      applyFiltersAndRender();
    } else {
      toast(t('toastNoLocation'));
    }
  } catch { toast('Could not geocode location.'); }
}

// ── API ──
async function loadTeeTimes() {
  const date = document.getElementById('filterDate').value;
  try {
    const r = await fetch(`${API_BASE}/tee-times?date=${date}&membersOnly=false`);
    const d = await r.json();
    allTeeTimes = d.teeTimes || [];
    updateStatus(d.lastUpdated);
  } catch { allTeeTimes = []; }
}

async function loadCourses() {
  try {
    const r = await fetch(`${API_BASE}/courses`);
    const courses = await r.json();
    allClubIds = courses.map(c => c.id);

    const parentGroups = {};
    for (const c of courses) {
      const group = CLUB_GROUPS[c.id];
      let parentName;
      if (group) {
        parentName = group.parent;
      } else {
        // For Minute Golf clubs, match by course name prefix against MINUTE_GROUPS
        const prefix = Object.keys(MINUTE_GROUPS).find(k => c.name.startsWith(k));
        parentName = prefix ? MINUTE_GROUPS[prefix].parent : c.name;
      }
      if (!parentGroups[parentName]) parentGroups[parentName] = [];
      parentGroups[parentName].push(c.id);
    }

    document.getElementById('clubGrid').innerHTML = Object.entries(parentGroups)
      .sort(([a],[b]) => a.localeCompare(b))
      .map(([name, ids]) => `<label class="club-checkbox-item" data-name="${name.toLowerCase()}" data-ids="${ids.join(',')}">
        <input type="checkbox" onchange="onClubCheckGroup(this,'${ids.join(',')}')"/>${name}
      </label>`).join('');
  } catch {}
}

async function loadStatus() {
  try {
    const r = await fetch(`${API_BASE}/status`);
    const s = await r.json();
    updateStatus(s.lastScrape);
  } catch {}
}

function updateStatus(ls) {
  if (!ls) return;
  lastScrapeTs = ls;
  renderStatusText();
};

function renderStatusText() {
  const el = document.getElementById('statusText');
  if (!el || !lastScrapeTs) return;
  el.dataset.loading = 'false';
  const m = Math.round((Date.now() - new Date(lastScrapeTs)) / 60000);
  if (m < 2) { el.textContent = t('updatedJust'); return; }
  el.textContent = currentLang === 'fr' ? `Mis à jour il y a ${m} min` : `Updated ${m}m ago`;
};

window.applyFiltersAndRender = function applyFiltersAndRender() {
  const players  = document.getElementById('filterPlayers').value;
  const timeFrom = document.getElementById('filterTimeFrom').value;
  const timeTo   = document.getElementById('filterTimeTo').value;
  const holes    = document.getElementById('filterHoles').value;
  const sort     = document.getElementById('sortSelect').value;
  const priceMin = parseFloat(document.getElementById('priceMin').value) || 0;
  const priceMax = parseFloat(document.getElementById('priceMax').value) || Infinity;
  const distKm   = parseInt(document.getElementById('distanceKm').value) || 20;

  // Update price badge
  const hasPriceFilter = document.getElementById('priceMin').value || document.getElementById('priceMax').value;
  document.getElementById('priceBadge').style.display = hasPriceFilter ? '' : 'none';
  document.getElementById('pillPrice').classList.toggle('active', !!hasPriceFilter);

  if (!players) { showPrompt(); return; }

  let results = [...allTeeTimes];
  results = results.filter(t => t.source === 'foreup' ? t.players >= parseInt(players) : t.players === parseInt(players));
  if (selectedClubs.size > 0) results = results.filter(t => selectedClubs.has(t.courseId));
  if (holes)    results = results.filter(t => t.holes === parseInt(holes));
  if (timeFrom) results = results.filter(t => t.time >= timeFrom);
  if (timeTo)   results = results.filter(t => t.time <= timeTo);

  // Price filter
  if (hasPriceFilter) {
    results = results.filter(t => {
      if (!t.pricePerPlayer) return true; // keep TBD
      return t.pricePerPlayer >= priceMin && t.pricePerPlayer <= priceMax;
    });
  }

  // Group by courseId+holes
  const courseMap = {};
  for (const t of results) {
    // Include courseName in key for Minute Golf clubs that share courseId
    const key = t.source === 'minutegolf' ? `${t.courseId}-${t.holes}-${t.courseName}` : `${t.courseId}-${t.holes}`;
    if (!courseMap[key]) courseMap[key] = { ...t, slots: [] };
    courseMap[key].slots.push(t);
  }
  for (const key of Object.keys(courseMap)) {
    const seen = new Set();
    courseMap[key].slots = courseMap[key].slots
      .filter(s => { if (seen.has(s.time)) return false; seen.add(s.time); return true; })
      .sort((a,b) => a.time.localeCompare(b.time));
  }

  // Group into parents
  const parentMap = {};
  for (const course of Object.values(courseMap)) {
    const group = CLUB_GROUPS[course.courseId];
    // For Minute Golf, match by courseName prefix against MINUTE_GROUPS
    let parentName, parentUrl;
    if (group) {
      parentName = group.parent;
      parentUrl  = group.url;
    } else if (course.source === 'minutegolf') {
      // Match courseName prefix (e.g. "UFO — Le Laval" → "UFO")
      const prefix = Object.keys(MINUTE_GROUPS).find(k => course.courseName.startsWith(k));
      if (prefix) {
        parentName = MINUTE_GROUPS[prefix].parent;
        parentUrl  = MINUTE_GROUPS[prefix].url;
      } else {
        parentName = course.courseName;
        parentUrl  = course.courseUrl || null;
      }
    } else {
      parentName = course.courseName;
      parentUrl  = course.courseUrl || null;
    }
    if (!parentMap[parentName]) {
      parentMap[parentName] = { parentName, parentUrl, courseId: course.courseId, source: course.source, courses: [], allSlots: [] };
    }
    parentMap[parentName].courses.push(course);
    parentMap[parentName].allSlots.push(...course.slots);
  }

  let parents = Object.values(parentMap);

  // Distance filter
  if (userLocation) {
    parents = parents.filter(p => {
      let coords = CLUB_COORDS[p.courseId] || MINUTE_COORDS[p.parentName] || null;
      if (!coords && p.courses) {
        for (const c of p.courses) { if (CLUB_COORDS[c.courseId]) { coords = CLUB_COORDS[c.courseId]; break; } }
      }
      if (!coords) return true;
      return haversineKm(userLocation.lat, userLocation.lng, coords.lat, coords.lng) <= distKm;
    });
  }

  // Sort
  if (sort === 'time')       parents.sort((a,b) => (a.allSlots[0]?.time||'').localeCompare(b.allSlots[0]?.time||''));
  if (sort === 'price-asc')  parents.sort((a,b) => Math.min(...a.allSlots.map(s=>s.pricePerPlayer||999)) - Math.min(...b.allSlots.map(s=>s.pricePerPlayer||999)));
  if (sort === 'price-desc') parents.sort((a,b) => Math.max(...b.allSlots.map(s=>s.pricePerPlayer||0)) - Math.max(...a.allSlots.map(s=>s.pricePerPlayer||0)));
  if (sort === 'name')       parents.sort((a,b) => a.parentName.localeCompare(b.parentName));
  if (sort === 'distance' && userLocation) {
    parents.sort((a,b) => {
      const ca = CLUB_COORDS[a.courseId] || MINUTE_COORDS[a.parentName];
      const cb = CLUB_COORDS[b.courseId] || MINUTE_COORDS[b.parentName];
      const da = ca ? haversineKm(userLocation.lat, userLocation.lng, ca.lat, ca.lng) : 999;
      const db = cb ? haversineKm(userLocation.lat, userLocation.lng, cb.lat, cb.lng) : 999;
      return da - db;
    });
  }

  document.getElementById('countNum').textContent = parents.length;
  activeSlot = null;

  if (!parents.length) {
    document.getElementById('resultsList').innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><line x1="12" y1="7" x2="12" y2="18" stroke-width="1.5"/><line x1="8.5" y1="18" x2="15.5" y2="18" stroke-width="1.5"/></svg>
        <h3>${t('noTimesTitle')}</h3>
        <p>${t('noTimesSub')}</p>
        <p style="margin-top:1rem;">
          <button onclick="switchTab('alerts')" style="background:none;border:none;color:var(--green-600);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-decoration:underline;">
            ${t('noTimesAlert')}
          </button>
        </p>
      </div>`;
    return;
  }

  document.getElementById('resultsList').innerHTML = parents.map((p,i) => renderParentCard(p,i)).join('');
  setTimeout(() => loadWeatherForParents(parents), 100);
};


// ── RENDER ──
function renderParentCard(pclub, idx) {
  const cardId   = `parent-${pclub.parentName.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'')}`;
  const delay    = Math.min(idx * 40, 300);
  const prices   = pclub.allSlots.map(s => s.pricePerPlayer).filter(Boolean);
  const minPrice = prices.length ? Math.min(...prices) : null;
  const maxPrice = prices.length ? Math.max(...prices) : null;
  const priceHtml = minPrice ? (minPrice === maxPrice ? `$${minPrice}` : `$${minPrice} – $${maxPrice}`) : 'TBD';
  const nameHtml = pclub.parentUrl
    ? `<a href="${pclub.parentUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${pclub.parentName} ↗</a>`
    : pclub.parentName;
  const coursesLabel = pclub.courses.length > 1 ? `${pclub.courses.length} courses` : '';

  let distHtml = '';
  if (userLocation) {
    let coords = CLUB_COORDS[pclub.courseId];
    // For Minute Golf clubs, look up by parent name
    if (!coords) coords = MINUTE_COORDS[pclub.parentName] || null;
    // Try sub-courses
    if (!coords && pclub.courses) {
      for (const c of pclub.courses) {
        if (CLUB_COORDS[c.courseId]) { coords = CLUB_COORDS[c.courseId]; break; }
      }
    }
    if (coords) {
      const km = haversineKm(userLocation.lat, userLocation.lng, coords.lat, coords.lng);
      distHtml = `<div class="distance-badge">📍 ${km.toFixed(1)} km away</div>`;
    }
  }

  return `
    <div class="parent-card" id="${cardId}" style="animation-delay:${delay}ms" data-parent="${JSON.stringify({parentName:pclub.parentName,parentUrl:pclub.parentUrl,courseId:pclub.courseId,courses:pclub.courses,allSlots:pclub.allSlots}).replace(/"/g,'&quot;')}">
      <div class="parent-card-header">
        <div class="parent-card-left">
          <div class="parent-card-name">${nameHtml}</div>
          ${coursesLabel ? `<div class="parent-card-subtitle">${coursesLabel}</div>` : ''}
          <div class="parent-weather-row" id="weather-${cardId}">
            <span style="font-size:12px;color:var(--ink-30)">${t('loadingWeather')}</span>
          </div>
          ${distHtml}
        </div>
        <div class="parent-card-right">
          <div class="parent-price-range">${priceHtml}</div>
          <div class="parent-price-label">CAD / joueur</div>
        </div>
      </div>
      <div class="parent-courses">
        ${pclub.courses.map(c => renderCourseSection(c, cardId)).join('')}
      </div>
    </div>`;
}

const SLOTS_STORE = {};

function renderCourseSection(course, parentCardId) {
  const sectionId = `section-${course.courseId}-${course.holes}-${course.courseName.replace(/[^a-zA-Z0-9]/g,'')}`;
  SLOTS_STORE[sectionId] = course.slots;
  const visible   = course.slots.slice(0, BUBBLES_INIT);
  const hidden    = course.slots.slice(BUBBLES_INIT);
  const bubbles   = visible.map(s =>
    `<button class="time-bubble" onclick="toggleSlot('${sectionId}','${s.id}','${parentCardId}')" data-slot-id="${s.id}">${fmt12(s.time)}</button>`
  ).join('');
  const moreBubble = hidden.length > 0
    ? `<button class="time-bubble show-more" onclick="expandSection('${sectionId}','${parentCardId}')">+${hidden.length} ${t('showMore')}</button>` : '';

  // For Minute Golf, extract sub-course name from "Club — SubCourse" format
  let label;
  if (course.source === 'minutegolf' && course.courseName.includes(' — ')) {
    label = course.courseName.split(' — ').slice(1).join(' — ');
  } else {
    const parentName = CLUB_GROUPS[course.courseId]?.parent || course.courseName;
    label = course.courseName !== parentName ? course.courseName : `${course.holes} holes`;
  }

  const holesLabel = currentLang === 'fr' ? 'tr' : 'h';
  return `
    <div class="course-section" id="${sectionId}" data-course-id="${course.courseId}">
      <div class="course-section-header">${label} · ${course.holes}${holesLabel}</div>
      <div class="course-bubbles-wrap">
        <div class="time-bubbles" id="bubbles-${sectionId}">${bubbles}${moreBubble}</div>
        <div id="detail-${sectionId}"></div>
      </div>
    </div>`;
}

window.expandSection = function expandSection(sectionId, parentCardId) {
  const section = document.getElementById(sectionId);
  const slots   = SLOTS_STORE[sectionId] || [];
  const el      = document.getElementById(`bubbles-${sectionId}`);
  el.innerHTML  = slots.map(s =>
    `<button class="time-bubble" onclick="toggleSlot('${sectionId}','${s.id}','${parentCardId}')" data-slot-id="${s.id}">${fmt12(s.time)}</button>`
  ).join('') + `<button class="time-bubble show-more" onclick="collapseSection('${sectionId}','${parentCardId}')">${t('showLess')}</button>`;
  setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

window.collapseSection = function collapseSection(sectionId, parentCardId) {
  const section = document.getElementById(sectionId);
  const slots   = SLOTS_STORE[sectionId] || [];
  const el      = document.getElementById(`bubbles-${sectionId}`);
  const detail  = document.getElementById(`detail-${sectionId}`);
  const visible = slots.slice(0, BUBBLES_INIT);
  const hidden  = slots.slice(BUBBLES_INIT);
  el.innerHTML  = visible.map(s =>
    `<button class="time-bubble" onclick="toggleSlot('${sectionId}','${s.id}','${parentCardId}')" data-slot-id="${s.id}">${fmt12(s.time)}</button>`
  ).join('') + (hidden.length > 0 ? `<button class="time-bubble show-more" onclick="expandSection('${sectionId}','${parentCardId}')">+${hidden.length} ${t('showMore')}</button>` : '');
  detail.innerHTML = '';
  activeSlot = null;
}

window.toggleSlot = async function toggleSlot(sectionId, slotId, parentCardId) {
  const section  = document.getElementById(sectionId);
  const slots    = SLOTS_STORE[sectionId] || [];
  const slot     = slots.find(s => s.id === slotId);
  const detail   = document.getElementById(`detail-${sectionId}`);
  const courseId = section.dataset.courseId;

  section.querySelectorAll('.time-bubble').forEach(b => b.classList.remove('active'));

  if (activeSlot && activeSlot.sectionId === sectionId && activeSlot.slotId === slotId) {
    detail.innerHTML = ''; activeSlot = null; return;
  }

  const clicked = section.querySelector(`[data-slot-id="${slotId}"]`);
  if (clicked) clicked.classList.add('active');
  activeSlot = { sectionId, slotId };

  const players    = document.getElementById('filterPlayers').value || '1';
  const bookingUrl = getBookingUrl(slot, players);
  const minNote    = (slot.minPlayers && slot.players < slot.minPlayers)
    ? `<span class="min-players-note">Min. ${slot.minPlayers} players</span>` : '';

  let weatherHtml = '';
  const coords = CLUB_COORDS[courseId];
  if (coords) {
    const hour = parseInt(slot.time.split(':')[0]);
    const w = await fetchHourlyWeather(courseId, coords.lat, coords.lng, slot.date, hour);
    if (w) weatherHtml = `<span class="slot-detail-weather">${w.icon} ${w.tStart}° → ${w.iconEnd} ${w.tEnd}°C</span>`;
  }

  detail.innerHTML = `
    <div class="slot-detail">
      <div class="slot-detail-left">
        <span class="slot-detail-time">${fmt12(slot.time)}</span>
        ${weatherHtml}${minNote}
        ${slot.pricePerPlayer
          ? `<span class="slot-detail-price">$${slot.pricePerPlayer} <span class="slot-detail-tax">CAD/player${slot.taxesMode?' '+slot.taxesMode:''}</span></span>`
          : `<span style="font-size:13px;color:var(--ink-60)">${currentLang === 'fr' ? 'Prix à déterminer' : 'Price TBD'}</span>`}
      </div>
      <div class="slot-detail-actions">
        <a class="book-btn" href="${bookingUrl}" target="_blank" rel="noopener">
          ${currentLang === "fr" ? "Réserver" : "Book now"} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>

        <button class="alert-btn-sm" onclick="prefillAlert('${slot.courseId}','${slot.date}','${slot.time}')">${currentLang === 'fr' ? '+ Alerte' : '+ Alert'}</button>
      </div>
    </div>`;
}

async function loadWeatherForParents(parents) {
  const date = document.getElementById('filterDate').value;
  for (const parent of parents) {
    let coords = CLUB_COORDS[parent.courseId];
    // For Minute Golf clubs, look up coords by exact parent name
    if (!coords && parent.source === 'minutegolf') {
      coords = MINUTE_COORDS[parent.parentName] || null;
    }
    // Also try sub-courses
    if (!coords && parent.courses) {
      for (const c of parent.courses) {
        if (CLUB_COORDS[c.courseId]) { coords = CLUB_COORDS[c.courseId]; break; }
      }
    }
    const cardId = `parent-${parent.parentName.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'')}`;
    const el     = document.getElementById(`weather-${cardId}`);
    if (!el || !coords) { if(el) el.innerHTML=''; continue; }
    const w = await fetchDailyWeather(parent.courseId, coords.lat, coords.lng, date);
    if (!w) { el.innerHTML=''; continue; }
    el.innerHTML = `<span class="parent-weather-icon">${w.icon}</span><div><div style="font-size:13px;font-weight:500;color:var(--ink)">${w.tmax}° / ${w.tmin}°C</div><div class="parent-weather-text">${w.desc}</div></div>`;
  }
}

function getBookingUrl(slot, players) {
  if (slot.source === 'chronogolf') return slot.bookingUrl.replace(/nb_players=\d+/, 'nb_players='+players);
  if (slot.source === 'foreup')     return slot.bookingUrl;
  return slot.bookingUrl.replace(/nbplayers=\d+/, 'nbplayers='+players);
}

function fmt12(t) {
  const [hh,mm] = t.split(':').map(Number);
  if (currentLang === 'fr') return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  return `${hh%12||12}:${String(mm).padStart(2,'0')} ${hh>=12?'PM':'AM'}`;
}

  if (cb.checked) { ids.forEach(id => selectedClubs.add(id)); cb.closest('.club-checkbox-item').classList.add('selected'); }
  else            { ids.forEach(id => selectedClubs.delete(id)); cb.closest('.club-checkbox-item').classList.remove('selected'); }

}

window.selectAllClubs = function selectAllClubs() {

  updateClubBadge(); applyFiltersAndRender();
}

window.checkAllClubs = function checkAllClubs() {
  document.querySelectorAll('.club-checkbox-item').forEach(label => {

    cb.checked=true; label.classList.add('selected'); ids.forEach(id=>selectedClubs.add(id));

window.filterClubGrid = function filterClubGrid() {

window.prefillAlert = function prefillAlert(courseId, date, time) {
  switchTab('alerts');
  const [hh] = time.split(':').map(Number);
  const cb = document.querySelector(`#alertClubGrid input[value="${courseId}"]`);
  if (cb) { cb.checked = true; updateAlertClubSelected(); }
  document.getElementById('alertDate').value     = date;
  document.getElementById('alertTimeFrom').value = `${String(Math.max(0,hh-1)).padStart(2,'0')}:00`;
  document.getElementById('alertTimeTo').value   = `${String(Math.min(23,hh+2)).padStart(2,'0')}:00`;
  document.getElementById('alertContact').focus();
}

window.createAlert = async function createAlert() {
  const contact = document.getElementById('alertContact').value.trim();
  if (!contact) { toast('Please enter an email or phone number.'); return; }
  const courseIds = window.getAlertCourseIds ? window.getAlertCourseIds() : [];
  const alert = {
    id: Date.now(), type: 'date-window', contact,
    courseIds: courseIds.length > 0 ? courseIds : null,
    courseId: courseIds.length === 1 ? courseIds[0] : null,
    date:     document.getElementById('alertDate').value || null,
    timeFrom: document.getElementById('alertTimeFrom').value || null,
    timeTo:   document.getElementById('alertTimeTo').value || null,
    players:  document.getElementById('alertPlayers').value || null,
    createdAt: new Date().toISOString(),
  };
  try {
    const r = await fetch(`${API_BASE}/alerts`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(alert) });
    if (r.status === 403) {
      const d = await r.json();
      if (d.error === 'free_limit') {
        showUpgradePrompt(contact);
        return;
      }
    }
  } catch {}
  localAlerts.push(alert);
  localStorage.setItem('teefind_alerts', JSON.stringify(localAlerts));
  renderLocalAlerts();
  document.getElementById('alertContact').value = '';
  toast(currentLang === 'fr' ? "Alerte créée! Vous serez notifié dès qu'un départ se libère." : "Alert created! We'll notify you when a tee time opens up.");
}

window.deleteAlert = function deleteAlert(id) {
  localAlerts = localAlerts.filter(a => a.id !== id);
  localStorage.setItem('teefind_alerts', JSON.stringify(localAlerts));
  renderLocalAlerts();
}

function renderLocalAlerts() {
  const badge = document.getElementById('alertTabBadge');
  badge.style.display = localAlerts.length ? '' : 'none';
  badge.textContent   = localAlerts.length;

  const html = localAlerts.length ? localAlerts.map(a => {
    const desc = a.type==='date-window'
      ? `${a.date} · ${fmtTime(a.timeFrom)} – ${fmtTime(a.timeTo)}`
      : `${allTeeTimes.find(t=>t.courseId===a.courseId)?.courseName||'Any course'}`;
    return `<div class="alert-item">
      <div><div class="alert-item-text">${desc}</div><div class="alert-item-sub">${a.contact}${a.players?` · ${a.players} players`:''}</div></div>
      <button class="delete-alert-btn" onclick="deleteAlert(${a.id})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
  }).join('') : '<div class="no-alerts-msg">No active alerts yet.</div>';

  const card2 = document.getElementById('activeAlertsCard2');
  const list2 = document.getElementById('alertsList2');
  card2.style.display = localAlerts.length ? '' : 'none';
  list2.innerHTML = html;
}

function fmtTime(t) {
  if (!t) return '';
  const [hh,mm] = t.split(':').map(Number);
  return `${hh%12||12}:${String(mm).padStart(2,'0')} ${hh>=12?'PM':'AM'}`;
}

      <input id="suggestEmail" type="email" placeholder="Your email (optional)" style="width:100%;height:40px;border:1.5px solid #e0e0e0;border-radius:10px;padding:0 12px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:14px;box-sizing:border-box;" />
      <button onclick="submitSuggestion()" style="width:100%;padding:12px;background:#3B6D11;color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;">Send suggestion</button>
      <button onclick="document.getElementById('suggestOverlay').remove()" style="width:100%;padding:8px;background:none;border:none;color:#666;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
}

async function submitSuggestion() {
  const name = document.getElementById('suggestName').value.trim();
  if (!name) { toast('Please enter a course name.'); return; }
  const email = document.getElementById('suggestEmail').value.trim();
  try {
    await fetch(`${API_BASE}/suggest-course`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ courseName: name, email })
    });
  } catch {}
  document.getElementById('suggestOverlay').remove();
  toast('Thanks! We\'ll look into adding that course.');
}

async function showUpgradePrompt(email) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';

      <div style="font-size:40px;margin-bottom:1rem;">⛳</div>
      <h2 style="font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:0.5rem;">Go Premium</h2>
      <p style="color:#666;font-size:14px;margin-bottom:1.5rem;line-height:1.5;">
        Free accounts get 1 alert. Upgrade to Premium for <strong>unlimited alerts</strong> at any course, any time.
      </p>
      <div style="font-family:'DM Serif Display',serif;font-size:36px;color:#3B6D11;margin-bottom:1.5rem;">$4.99<span style="font-size:16px;color:#666;">/month</span></div>
      <button onclick="startCheckout('${email}')" style="width:100%;padding:14px;background:#3B6D11;color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;cursor:pointer;margin-bottom:10px;">

async function startCheckout(email) {
  try {
    const r = await fetch(`${API_BASE}/create-checkout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (d.url) window.location.href = d.url;
  } catch { toast('Could not start checkout. Please try again.'); }
}

window.toggleLang = function toggleLang() {
  currentLang = currentLang === 'en' ? 'fr' : 'en';
  document.getElementById('langToggle').textContent = currentLang === 'en' ? 'FR' : 'EN';
  // Clear weather cache so descriptions reload in new language
  Object.keys(weatherCache).forEach(k => delete weatherCache[k]);
  applyTranslations();
};

function t(key) {
  return TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key] || key;
}

function applyTranslations() {
  const T = TRANSLATIONS[currentLang];

  // Tabs
  document.querySelector('#tabFind').childNodes[2].textContent = ' ' + T.tabFind;
  document.querySelector('#tabAlerts').childNodes[2].textContent = ' ' + T.tabAlerts;

  // Hero
  document.querySelector('.hero h1').innerHTML = T.heroTitle;
  document.querySelector('.hero-sub').textContent = T.heroSub;

  // Filter labels
  const labels = document.querySelectorAll('.field label');
  const labelKeys = ['labelDate','labelPlayers','labelFrom','labelTo','labelHoles','labelSort'];
  labels.forEach((l, i) => { if (labelKeys[i]) l.textContent = T[labelKeys[i]]; });

  // Search button
  document.getElementById('searchBtn').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> ${T.searchBtn}`;

  // Filter pills
  document.getElementById('pillClub').childNodes[2].textContent = ' ' + T.filterClub + ' ';
  document.getElementById('pillPrice').childNodes[2].textContent = ' ' + T.filterPrice + ' ';

  // Select options
  const players = document.getElementById('filterPlayers');
  if (players) {
    players.options[0].text = T.labelPlayers;
    players.options[1].text = T.opt1p;
    players.options[2].text = T.opt2p;
    players.options[3].text = T.opt3p;
    players.options[4].text = T.opt4p;
  }

  const holes = document.getElementById('filterHoles');
  if (holes) {
    holes.options[0].text = T.optAny;
    holes.options[1].text = T.opt9h;
    holes.options[2].text = T.opt18h;
  }

  const sort = document.getElementById('sortSelect');
  if (sort) {
    sort.options[0].text = T.sortEarliest;
    sort.options[1].text = T.sortPriceUp;
    sort.options[2].text = T.sortPriceDown;
    sort.options[3].text = T.sortDistance;
    sort.options[4].text = T.sortName;
  }

  // Club filter header
  const clubTitle = document.querySelector('.club-filter-title');
  if (clubTitle) clubTitle.textContent = T.selectClubs;
  const clubActions = document.querySelectorAll('.club-filter-action');
  if (clubActions[0]) clubActions[0].textContent = T.showAll;
  if (clubActions[1]) clubActions[1].textContent = T.checkAll;
  const clubSearch = document.getElementById('clubSearch');
  if (clubSearch) clubSearch.placeholder = T.searchClubs;

  // Location placeholder
  const locInput = document.getElementById('locationInput');
  if (locInput) locInput.placeholder = T.locationPlaceholder;

  // Price label
  const priceLabel = document.querySelector('.price-range-label');
  if (priceLabel) priceLabel.textContent = T.priceLabel;

  // Results count
  const countNum = document.getElementById('countNum').textContent;
  document.querySelector('.results-count').innerHTML = `<strong id="countNum">${countNum}</strong> ${T.countClubs}`;

  // Alerts tab
  const alertHeaders = document.querySelectorAll('.alerts-page-header h2');
  if (alertHeaders[0]) alertHeaders[0].textContent = T.alertsTitle;
  const alertDescs = document.querySelectorAll('.alerts-page-header p');
  if (alertDescs[0]) alertDescs[0].textContent = T.alertsDesc;
  if (alertHeaders[1]) alertHeaders[1].textContent = T.activeAlerts;

  // Alert form labels - update all form-row labels in alerts tab
  const alertBody = document.querySelector('.alerts-page-body');
  if (alertBody) {
    const formLabels = alertBody.querySelectorAll('.form-row > label');
    const alertLabelKeys = ['clubLabel', 'dateLabel', 'timeRangeLabel', 'playersLabel', 'notifyLabel'];
    formLabels.forEach((l, i) => {
      if (alertLabelKeys[i]) {
        // preserve the hint span if present
        const hint = l.querySelector('span');
        l.textContent = T[alertLabelKeys[i]] + ' ';
        if (hint && i === 0) {
          hint.textContent = T.clubHint;
          l.appendChild(hint);
        }
      }
    });
  }

  // Alert form inputs
  const alertContact = document.getElementById('alertContact');
  if (alertContact) alertContact.placeholder = T.notifyPlaceholder;

  const alertClubSearch = document.getElementById('alertClubSearch');
  if (alertClubSearch) alertClubSearch.placeholder = T.searchClubs;

  // Alert clear all button
  const alertClearBtn = document.querySelector('#alertClubGrid').parentElement?.querySelector('.club-filter-action');
  if (alertClearBtn) alertClearBtn.textContent = T.clearAll;

  // Create alert button
  const createBtn = document.querySelector('.create-alert-btn');
  if (createBtn) createBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${T.createAlert}`;

  // Alert players dropdown
  const alertPlayers = document.getElementById('alertPlayers');
  if (alertPlayers) {
    alertPlayers.options[0].text = T.optAny;
    alertPlayers.options[1].text = T.opt1p;
    alertPlayers.options[2].text = T.opt2p;
    alertPlayers.options[3].text = T.opt3p;
    alertPlayers.options[4].text = T.opt4p;
  }

  // No alerts message
  const noAlertsMsg = document.querySelector('.no-alerts-msg');
  if (noAlertsMsg) noAlertsMsg.textContent = T.noAlerts;

  // Status pill (loading or already showing a timestamp)
  const statusEl = document.getElementById('statusText');
  if (statusEl) {
    if (statusEl.dataset.loading === 'false') renderStatusText();
    else statusEl.textContent = T.statusLoading;
  }

  // Near label
  const labelNear = document.getElementById('labelNear');
  if (labelNear) labelNear.textContent = currentLang === 'fr' ? 'Près de' : 'Near';

  // Float filter button
  const floatBtn = document.getElementById('floatFilterBtn');
  if (floatBtn) floatBtn.childNodes[2].textContent = ' ' + T.filtersBtn;

  // Re-render results to pick up translated strings
  const playersVal = document.getElementById('filterPlayers').value;
  if (!playersVal) showPrompt();
  else if (allTeeTimes.length > 0) applyFiltersAndRender();
}

function toast(msg) {
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
